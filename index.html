<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raditya | Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
background:
linear-gradient(
135deg,
#1d4ed8 0%,
#2563eb 50%,
#22d3ee 100%
);

height:100vh;
position:relative;
}

/* ====================
BACKGROUND
==================== */

.bg-pattern{
position:absolute;
inset:0;

background-image:
radial-gradient(
rgba(255,255,255,.08) 2px,
transparent 2px
);

background-size:30px 30px;
}

.orb{
position:absolute;
border-radius:50%;
filter:blur(10px);

background:
rgba(255,255,255,.12);

backdrop-filter:blur(10px);
}

.orb-1{
width:220px;
height:220px;

top:10%;
left:8%;

animation:float 10s infinite ease-in-out;
}

.orb-2{
width:130px;
height:130px;

right:15%;
top:15%;

animation:float 7s infinite ease-in-out;
}

.orb-3{
width:90px;
height:90px;

bottom:20%;
left:20%;

animation:float 8s infinite ease-in-out;
}

.orb-4{
width:160px;
height:160px;

bottom:15%;
right:12%;

animation:float 12s infinite ease-in-out;
}

/* ====================
MOUSE GLOW
==================== */

#mouse-glow{
position:fixed;

width:350px;
height:350px;

border-radius:50%;

background:
rgba(255,255,255,.12);

filter:blur(120px);

pointer-events:none;

z-index:1;
}

/* ====================
HERO
==================== */

.hero{

position:relative;
z-index:5;

width:100%;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;
text-align:center;
}

.hero-content{

max-width:900px;

animation:
fadeUp 1s ease forwards;
}

.hero-badge{

display:inline-flex;
align-items:center;
gap:10px;

padding:12px 24px;

border-radius:999px;

background:
rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border:
1px solid rgba(255,255,255,.15);

color:white;

font-size:.9rem;

margin-bottom:30px;
}

.hero-title{

font-size:
clamp(3rem,8vw,6rem);

font-weight:800;

line-height:1.1;

color:white;

margin-bottom:20px;
}

.hero-title span{

color:#a5f3fc;
}

.typing{

font-size:1.5rem;

font-weight:600;

color:#dbeafe;

height:40px;

margin-bottom:25px;
}

.hero-description{

max-width:700px;

margin:auto;

line-height:1.8;

color:
rgba(255,255,255,.9);

font-size:1.05rem;

margin-bottom:40px;
}

/* ====================
BUTTON
==================== */

.hero-btn{

position:relative;

display:inline-flex;
align-items:center;
gap:10px;

padding:18px 40px;

background:white;

color:#2563eb;

font-weight:700;

border-radius:16px;

text-decoration:none;

overflow:hidden;

box-shadow:
0 20px 40px rgba(0,0,0,.18);

transition:.35s ease;
}

.hero-btn:hover{

transform:
translateY(-5px);

box-shadow:
0 30px 60px rgba(0,0,0,.25);
}

.hero-btn::before{

content:'';

position:absolute;

top:0;
left:-100%;

width:100%;
height:100%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.7),
transparent
);

transition:.8s;
}

.hero-btn:hover::before{

left:100%;
}

/* ====================
FLOATING CARDS
==================== */

.floating-card{

position:absolute;

padding:15px 20px;

border-radius:18px;

background:
rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border:
1px solid rgba(255,255,255,.15);

color:white;

font-weight:600;
}

.card-1{

top:25%;
left:8%;

animation:float 6s infinite ease-in-out;
}

.card-2{

top:20%;
right:8%;

animation:float 8s infinite ease-in-out;
}

.card-3{

bottom:18%;
right:15%;

animation:float 10s infinite ease-in-out;
}

/* ====================
SCROLL
==================== */

.scroll-indicator{

position:absolute;

bottom:35px;
left:50%;

transform:translateX(-50%);

color:white;

font-size:.85rem;

opacity:.8;

animation:bounce 2s infinite;
}

/* ====================
ANIMATION
==================== */

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-20px);
}

}

@keyframes bounce{

0%,100%{
transform:
translateX(-50%)
translateY(0);
}

50%{
transform:
translateX(-50%)
translateY(10px);
}

}

@keyframes fadeUp{

from{
opacity:0;
transform:
translateY(50px);
}

to{
opacity:1;
transform:
translateY(0);
}

}

/* ====================
MOBILE
==================== */

@media(max-width:768px){

.floating-card{
display:none;
}

.typing{
font-size:1.1rem;
}

.hero-description{
font-size:.95rem;
}

.hero-btn{
padding:16px 30px;
}

}

</style>

</head>

<body>

<div id="mouse-glow"></div>

<div class="bg-pattern"></div>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="orb orb-4"></div>

<div class="floating-card card-1">
💻 Web Developer
</div>

<div class="floating-card card-2">
🛡️ Cyber Security
</div>

<div class="floating-card card-3">
🚀 Modern Solutions
</div>

<section class="hero">

<div class="hero-content">

<div class="hero-badge">
🚀 Welcome To My Portfolio
</div>

<h1 class="hero-title">
Hi, I'm <span>Raditya</span>
</h1>

<div class="typing">
<span id="typing"></span>
</div>

<p class="hero-description">
Building modern websites, digital experiences, and innovative solutions that help businesses grow faster in the digital era.
</p>

<a href="index2.html" class="hero-btn">
Explore Portfolio →
</a>

</div>

<div class="scroll-indicator">
Scroll Down
</div>

</section>

<script>

const texts = [
"Web Developer",
"Digital Solution Builder",
"Cyber Security Enthusiast",
"Freelancer"
];

let index = 0;

const typing =
document.getElementById("typing");

function changeText(){

typing.style.opacity="0";

setTimeout(()=>{

typing.textContent =
texts[index];

typing.style.opacity="1";

index =
(index+1)%texts.length;

},300);

}

typing.textContent =
texts[0];

setInterval(changeText,2500);

/* Mouse Glow */

const glow =
document.getElementById("mouse-glow");

document.addEventListener(
"mousemove",
(e)=>{

glow.style.left =
(e.clientX-175)+"px";

glow.style.top =
(e.clientY-175)+"px";

});

</script>

</body>
</html>
```
